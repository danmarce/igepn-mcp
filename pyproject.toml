[project]
name = "igepn-mcp"
version = "0.1.0"
description = "IGEPN (Ecuador) earthquake + volcano reports from its public Telegram channel -> SQLite -> structured MCP tools"
readme = "README.md"
authors = [
    { name = "Daniel Nunez", email = "danmarce@gmail.com" }
]
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12",
    "truststore>=0.10",
]

[project.scripts]
igepn-mcp = "igepn_mcp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
